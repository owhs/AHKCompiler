; Strippable features. A profile's remove= lists section names from here.
; define  = preprocessor symbol(s) the feature patch keys off (patches\0001-feature-switches.patch)
; implies = features removed automatically alongside this one
; kb      = measured x64 saving (optimize=size, crt=os); refresh via Tools > Measure
; group   = how the GUI buckets it
; needs   = a capability the feature depends on (informational)
;
; A script that calls a removed function fails at load with a clear error.

[gui]
title=GUI windows (whole frame)
group=Interface
define=NO_GUI
kb=90
desc=The Gui class and every control, GuiFromHwnd, GuiCtrlFromHwnd. MsgBox, InputBox, ToolTip, TrayTip, Menu and the tray menu stay.

[gui-adv]
title=GUI: ListView / TreeView / StatusBar
group=Interface
define=NO_GUI_ADV
kb=11
desc=Just the ListView, TreeView and StatusBar controls (the "components, not the frame" split). The rest of the GUI keeps working.

[com]
title=COM (ComObject, ComCall, ...)
group=Interop
define=NO_COM
implies=gui-activex
kb=20
desc=ComObject, ComValue, ComObjArray, ComCall, ComObjActive/Get/Connect/Query/... Removing COM also removes the ActiveX control (it needs COM).

[gui-activex]
title=GUI: ActiveX control only
group=Interface
define=NO_GUI_ACTIVEX
kb=1
desc=Just the Gui ActiveX control (Shell.Explorer etc.). Keeps the rest of COM and the rest of the GUI - so you can have GUI and COM but no ActiveX.

[dllcall]
title=DllCall / CallbackCreate
group=Interop
define=NO_DLLCALL
kb=8
desc=DllCall, ComCall and CallbackCreate/CallbackFree. Many libraries need DllCall, so weigh this one.

[debugger]
title=Script debugger (DBGp)
group=Diagnostics
define=NO_DEBUGGER
kb=43
desc=The /Debug switch used by SciTE4AutoHotkey and VS Code. Also thins out Error.Stack and the crash dialog's call stack.

[regex]
title=Regular expressions
group=Text
define=NO_REGEX
implies=regex-unicode
kb=151
desc=RegExMatch, RegExReplace, the ~= operator, RegExMatchInfo and SetTitleMatchMode "RegEx". Drops the whole engine. (Prefer switching the RegEx backend to Windows instead of removing it.)

[regex-unicode]
title=RegEx Unicode tables
group=Text
define=NO_UCP
kb=74
desc=Keeps RegEx (PCRE backend) but drops Unicode property tables: \p{...}, (*UCP), and case-insensitive matching of non-ASCII letters. Ignored when the RegEx backend is Windows.

[registry]
title=Registry
group=System
define=NO_REGISTRY
kb=6
desc=RegRead, RegWrite, RegDelete, RegDeleteKey, RegCreateKey, SetRegView and Loop Reg.

[drive]
title=Drive functions
group=System
define=NO_DRIVE
kb=4
desc=DriveGet*/DriveSet*/DriveEject/DriveLock/... (drive info and CD tray control).

[sound]
title=Sound
group=Media
define=NO_SOUND
kb=5
desc=SoundGet*/SoundSet* (volume, mute, device names), SoundBeep and SoundPlay.

[image]
title=Pixel & image search
group=Media
define=NO_IMAGE
kb=6
desc=PixelGetColor, PixelSearch and ImageSearch. (LoadPicture and Gui pictures stay.)

[network]
title=Network
group=System
define=NO_NETWORK
kb=2
desc=Download and SysGetIPAddresses.

[process]
title=Process functions
group=System
define=NO_PROCESS
kb=2
desc=ProcessExist, ProcessClose, ProcessWait, ProcessSetPriority, ProcessGetName/Path/Parent. (Window functions stay.)

[run]
title=Run / RunWait
group=System
define=NO_RUN
kb=2
desc=Run, RunWait and RunAs - launching external programs. Useful for locked-down / sandboxed builds.
